name: PyMuPDF-Free Isolation Gate

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pymupdf-free-isolation.yml'
      - 'requirements-app.txt'
      - 'app.py'
      - 'biblioref/**'
      - 'biblioref_v0_*.py'
      - 'tests_support/**'
      - 'test*.py'
      - 'tests_core/**'
      - 'tools/pymupdf_free_smoke.py'
      - 'tools/run_pdfium_current_tests.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    name: Exercise default pipeline and current suite without PyMuPDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up clean Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Create isolated environment and install default requirements
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/biblioref-no-pymupdf"
          VENV_PY="$RUNNER_TEMP/biblioref-no-pymupdf/bin/python"
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install -r requirements-app.txt
          "$VENV_PY" -m pip install "httpx>=0.27,<1.0" pytest pandas httpx2
          "$VENV_PY" -m pip check

      - name: Prove default installation excludes PyMuPDF
        shell: bash
        run: |
          VENV_PY="$RUNNER_TEMP/biblioref-no-pymupdf/bin/python"
          "$VENV_PY" - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          from importlib.util import find_spec
          from pathlib import Path
          import os
          import re
          import site
          import sys

          assert sys.prefix != sys.base_prefix, "Python is not running inside a venv"
          assert site.ENABLE_USER_SITE is False, "User site-packages must be disabled"

          try:
              version("PyMuPDF")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("PyMuPDF distribution is installed by default")

          assert find_spec("pymupdf") is None, "pymupdf module is importable"
          assert find_spec("fitz") is None, "fitz module is importable"

          pdfium_version = version("pypdfium2")
          match = re.match(r"^(\d+)\.(\d+)", pdfium_version)
          assert match is not None, f"Unexpected pypdfium2 version: {pdfium_version}"
          major_minor = tuple(map(int, match.groups()))
          assert (5, 13) <= major_minor < (6, 0), (
              f"pypdfium2 {pdfium_version} does not satisfy >=5.13,<6.0"
          )

          report = "\n".join(
              [
                  "BiblioRef default PDFium-first isolation gate: PASS",
                  f"Python: {sys.version.split()[0]}",
                  f"Virtual environment: {sys.prefix}",
                  f"Base Python: {sys.base_prefix}",
                  "System site-packages inherited: no",
                  "User site-packages enabled: no",
                  "PyMuPDF distribution installed: no",
                  "pymupdf importable: no",
                  "fitz importable: no",
                  f"pypdfium2: {pdfium_version}",
                  "Scope: default requirements, smoke matrix, and current suite",
              ]
          ) + "\n"

          report_path = Path(os.environ["RUNNER_TEMP"]) / "pymupdf-free-isolation-report.txt"
          report_path.write_text(report, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Default PDFium-first isolation gate\n\n")
              handle.write("```text\n")
              handle.write(report)
              handle.write("```\n")
          print(report, end="")
          PY
          "$VENV_PY" -m pip freeze --all > "$RUNNER_TEMP/pip-freeze-no-pymupdf.txt"

      - name: Run PyMuPDF-free smoke matrix
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          VENV_PY="$RUNNER_TEMP/biblioref-no-pymupdf/bin/python"
          "$VENV_PY" tools/pymupdf_free_smoke.py --output-dir "$RUNNER_TEMP"

      - name: Run current PDFium-only test lane
        id: current_suite
        continue-on-error: true
        shell: bash
        env:
          BIBLIOREF_REQUIRE_PDFIUM_ONLY: "1"
        run: |
          VENV_PY="$RUNNER_TEMP/biblioref-no-pymupdf/bin/python"
          "$VENV_PY" tools/run_pdfium_current_tests.py

      - name: Upload isolation and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pymupdf-free-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pymupdf-free-isolation-report.txt
            ${{ runner.temp }}/pip-freeze-no-pymupdf.txt
            ${{ runner.temp }}/pymupdf-free-smoke-results.json
            ${{ runner.temp }}/pymupdf-free-smoke-report.md
          retention-days: 7

      - name: Enforce required PyMuPDF-free gates
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "One or more PyMuPDF-free smoke checks failed."
            failed=1
          fi
          if [ "${{ steps.current_suite.outcome }}" != "success" ]; then
            echo "The current PDFium-only test lane failed."
            failed=1
          fi
          exit "$failed"
