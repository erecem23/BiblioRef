name: Metadata Resolver Gate

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: MetadataResolver strict deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-pymupdf-compat.txt

      - name: Install default application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pytest pandas httpx2

      - name: MetadataResolver focused tests
        run: |
          python -m pytest -q \
            tests_app/test_crossref_backend_v0_1.py \
            tests_app/test_openalex_backend_v0_1.py \
            tests_app/test_metadata_consensus_v0_1.py \
            tests_app/test_metadata_resolver_v0_1.py \
            tests_app/test_semantic_resolver_v0_1.py \
            tests_app/test_bibliographic_rag_v0_1.py \
            tests_app/test_bibliographic_rag_store_v0_1.py \
            tests_app/test_local_ai_adjudicator_v0_1.py \
            tests_app/test_rag_llm_adjudicator_v0_2.py \
            tests_app/test_resolution_decision_v0_1.py \
            tests_app/test_resolution_benchmark_v0_1.py \
            tests_app/test_resolution_audit_export_v0_1.py

      - name: Add historical PyMuPDF compatibility dependencies
        run: python -m pip install -r requirements-pymupdf-compat.txt

      - name: Full repository suite
        run: python -m pytest -q

  network-smoke:
    name: Crossref/OpenAlex network smoke (non-blocking)
    runs-on: ubuntu-latest
    needs: deterministic
    if: ${{ always() }}
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt

      - name: Verify live public metadata APIs
        run: |
          python - <<'PY'
          from biblioref.resolver.crossref import CrossrefBackend
          from biblioref.resolver.openalex import OpenAlexBackend
          from biblioref.resolver.models import ResolverQuery

          doi = "10.1038/nphys1170"
          query = ResolverQuery(raw_reference=f"https://doi.org/{doi}", doi=doi)

          crossref = CrossrefBackend(rows=1, timeout=15).search(query)
          assert crossref, "Crossref returned no candidate for the smoke-test DOI"
          assert crossref[0].doi == doi, (crossref[0].doi, doi)
          print("Crossref smoke: OK", crossref[0].doi, crossref[0].title)

          openalex = OpenAlexBackend(rows=1, timeout=15).search(query)
          assert openalex, "OpenAlex returned no candidate for the smoke-test DOI"
          assert openalex[0].doi == doi, (openalex[0].doi, doi)
          print("OpenAlex smoke: OK", openalex[0].doi, openalex[0].title)
          PY