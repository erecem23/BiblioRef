name: v0.9.10-rc2 integration

on:
  pull_request:
    branches:
      - integration/v0.9.10-rc2-algo-0.6.7
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt
      - name: Install test-only dependencies
        run: |
          python -m pip install pytest pandas httpx2
      - name: Compile package and key scripts
        run: |
          python -m compileall -q biblioref tests_core
      - name: Run complete test suite
        run: |
          python -m pytest -q
